name: Build generic personal image (sealed)
on:
  workflow_dispatch:
    inputs:
      monitor_revision:
        description: Exact public source commit consumed by the personal build
        required: true
        type: string
      delivery_public_key:
        description: One-time RSA 3072+ public key (base64 DER SPKI)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate public source pin
        shell: bash
        env:
          MONITOR_REVISION: ${{ inputs.monitor_revision }}
        run: '[[ "$MONITOR_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.monitor_revision }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Build from public source only
        run: |
          python -m pip install platformio==6.1.19 cryptography==46.0.7
          python tools/build_firmware.py --profile personal
      - name: Seal the image for its recipient
        shell: bash
        env:
          DELIVERY_PUBLIC_KEY: ${{ inputs.delivery_public_key }}
        run: |
          python - <<'PY'
          import base64
          import io
          import os
          from pathlib import Path
          import struct
          import zipfile
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding, rsa
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          recipient = serialization.load_der_public_key(
              base64.b64decode(os.environ["DELIVERY_PUBLIC_KEY"], validate=True)
          )
          if not isinstance(recipient, rsa.RSAPublicKey) or recipient.key_size < 3072:
              raise SystemExit("Expected an RSA public key of at least 3072 bits")

          payload = io.BytesIO()
          with zipfile.ZipFile(payload, mode="w", compression=zipfile.ZIP_DEFLATED) as archive:
              for source in sorted(Path("dist/personal").iterdir()):
                  archive.write(source, source.name)
          key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          wrapped = recipient.encrypt(
              key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None)
          )
          magic = b"SWT1"
          cipher = AESGCM(key).encrypt(nonce, payload.getvalue(), magic)
          Path("personal.swt").write_bytes(magic + struct.pack(">I", len(wrapped)) + wrapped + nonce + cipher)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-personal-image
          path: personal.swt
          if-no-files-found: error
          retention-days: 1
